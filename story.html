<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>墨灵 · 灵感的形态演变</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080711;--ink:#f2efe9;--ink-dim:#9a93a8;
    --gold:#e8b04b;--gold-2:#ffd98a;--cyan:#39e7d6;--red:#e3543b;--violet:#9b6bff;
    --line:rgba(255,255,255,.10);--glass:rgba(18,16,28,.55);
    --display:"Space Grotesk","PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
    --sans:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* 降级背景：即使 WebGL 失败也有沉浸暗色，绝不白屏 */
  body{
    background:
      radial-gradient(60% 50% at 30% 30%,rgba(232,176,75,.10),transparent 60%),
      radial-gradient(55% 45% at 75% 70%,rgba(57,231,214,.08),transparent 60%),
      #080711;
    color:var(--ink);font-family:var(--sans);overflow-x:hidden;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold);color:#000}
  button{font-family:inherit}

  header{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;backdrop-filter:blur(12px);background:linear-gradient(180deg,rgba(8,7,17,.7),transparent)}
  .logo{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:.5px}
  .logo .mark{width:36px;height:36px;border-radius:10px;background:conic-gradient(from 200deg,var(--gold),var(--red),var(--cyan),var(--gold));display:grid;place-items:center;color:#05050a;font-size:19px;font-weight:900}
  .navbtns{display:flex;gap:12px}
  .btn{padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:transform .2s,box-shadow .3s}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#05050a;box-shadow:0 8px 30px rgba(232,176,75,.35)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(232,176,75,.5)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* 固定全屏 3D 画布（始终在底层） */
  #scene3d{position:fixed;inset:0;z-index:1;display:block}
  /* 内容层 */
  .content{position:relative;z-index:5}

  /* HERO */
  .hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;pointer-events:none}
  .hero .badge{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);font-size:13px;color:var(--gold-2);margin-bottom:30px}
  .hero .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hero h1{font-family:var(--display);font-size:clamp(40px,6.5vw,88px);font-weight:700;line-height:1.04;letter-spacing:-.02em;text-shadow:0 4px 40px rgba(0,0,0,.5)}
  .hero h1 .accent{color:var(--gold)}
  .hero p{margin-top:24px;color:var(--ink-dim);font-size:clamp(15px,1.6vw,19px);max-width:520px}

  /* 滚动叙事：每个阶段一屏，文字浮在 3D 上 */
  .stage{height:100vh;display:flex;align-items:center;padding:0 8vw;position:relative}
  .stage:nth-child(even){justify-content:flex-end;text-align:right}
  .stage-card{max-width:440px;pointer-events:none}
  .stage-card .step-n{font-family:var(--display);font-size:13px;color:var(--gold);letter-spacing:.22em;text-transform:uppercase;margin-bottom:14px;opacity:0}
  .stage-card h2{font-family:var(--display);font-size:clamp(30px,4.2vw,54px);font-weight:700;line-height:1.1;letter-spacing:-.015em;margin-bottom:18px;opacity:0}
  .stage-card p{color:var(--ink-dim);font-size:clamp(15px,1.5vw,18px);margin-bottom:18px;opacity:0}
  .stage-card .tool{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:7px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--cyan);backdrop-filter:blur(8px);opacity:0}
  .stage-card .time{font-size:13px;color:var(--gold-2);margin-top:14px;opacity:0}
  /* prompt 阶段居中 */
  .stage.s0{justify-content:center;text-align:center}
  .stage.s0 .stage-card{max-width:760px}
  .stage.s0 .typed{font-family:var(--display);font-size:clamp(24px,3.4vw,46px);font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .stage.s0 .typed .cursor{color:var(--gold)}

  .story-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--cyan),var(--violet));width:0;z-index:250}

  /* 右侧阶段圆点指示 */
  .dots{position:fixed;right:34px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:14px}
  @media(max-width:860px){.dots{right:16px}}
  .dots .d{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s;cursor:pointer}
  .dots .d.active{background:var(--gold);box-shadow:0 0 12px var(--gold);transform:scale(1.4)}

  /* FINAL */
  .final{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw;position:relative}
  .final h2{font-family:var(--display);font-size:clamp(32px,5vw,66px);font-weight:700;max-width:880px;line-height:1.1;letter-spacing:-.015em;text-shadow:0 4px 40px rgba(0,0,0,.5)}
  .final h2 .accent{color:var(--gold)}
  .final p{color:var(--ink-dim);font-size:18px;margin:24px 0 36px}
  .final .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  footer{position:relative;z-index:5;border-top:1px solid var(--line);padding:40px 5vw;text-align:center;color:var(--ink-dim);font-size:13px;background:var(--bg)}

  #loading{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;transition:opacity .8s}
  #loading .ring{width:46px;height:46px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading.hide{opacity:0;pointer-events:none}

  /* 移动端：阶段卡片统一为左对齐单列，避免奇偶交替在窄屏错乱 */
  @media(max-width:760px){
    .stage{padding:0 6vw}
    .stage:nth-child(even){justify-content:flex-start;text-align:left}
    .stage-card{max-width:none}
    .hero p{max-width:none}
  }
  /* 无障碍：尊重 reduced-motion，关闭装饰动画 */
  @media(prefers-reduced-motion:reduce){
    .hero .badge .dot{animation:none}
    *{scroll-behavior:auto!important}
  }
</style>
</head>
<body>

<div id="loading"><div class="ring"></div><div style="color:var(--ink-dim);font-size:14px;letter-spacing:2px">正在凝聚灵感…</div></div>

<canvas id="scene3d"></canvas>

<header>
  <div class="logo"><div class="mark">墨</div>墨灵 MoLing</div>

<div class="content">
  <!-- HERO -->
  <section class="hero">
    <div class="badge"><span class="dot"></span>见证灵感凝聚成游戏资产</div>
    <h1>让灵感，<br>长出<span class="accent">形态</span></h1>

  <section class="final">

    <div class="row">
      <button class="btn btn-primary" style="padding:16px 38px;font-size:16px">开始创作</button>
      <button class="btn btn-ghost" style="padding:16px 30px;font-size:16px">查看作品集</button>
    </div>

  <footer>墨灵 MoLing · 专为游戏美术生产打造的 AI 引擎</footer>

<script>
/* ====================================================================
   阶段数据
==================================================================== */
const STAGES=[
  {n:'STEP 01',title:'一缕灵感',desc:'用一句话描述你的构想。此刻它还是一团流动的混沌，蕴含无限可能。',tool:'✦ 文本理解引擎',time:'0 秒 · 你只管想象',
   color:[0.91,0.69,0.29],noise:1.4,disp:0.55,glow:1.3,particle:0.2,shard:0.0,shatter:0.0,disperse:0.3},
  {n:'STEP 02',title:'结构涌现',desc:'AI 开始构建底层结构——拓扑与布线在混沌中析出，秩序逐渐成形。',tool:'⬡ AI 拓扑生成',time:'约 30 秒',
   color:[0.22,0.9,0.84],noise:2.6,disp:0.42,glow:1.6,particle:0.5,shard:0.85,shatter:0.0,disperse:0.5},
  {n:'STEP 03',title:'素体成形',desc:'纯净的基础形态确立，体块、比例与剪影一目了然，随时可调。',tool:'◳ 基础网格建模',time:'约 1 分钟',
   color:[0.78,0.8,0.86],noise:0.5,disp:0.12,glow:1.0,particle:0.3,shard:0.4,shatter:0.0,disperse:0.15},
  {n:'STEP 04',title:'多面审视',desc:'形态自由旋转、分解，多角度审视细节，方便审稿与团队对齐。',tool:'▦ 多视角导出',time:'约 20 秒',
   color:[0.6,0.62,0.72],noise:1.0,disp:0.3,glow:1.1,particle:0.7,shard:0.6,shatter:0.45,disperse:0.4},
  {n:'STEP 05',title:'材质绽放',desc:'色彩、金属、光泽倾泻而下，PBR 材质让形态瞬间鲜活、富有质感。',tool:'◐ PBR 材质引擎',time:'约 40 秒',
   color:[0.89,0.33,0.23],noise:1.8,disp:0.36,glow:2.0,particle:0.8,shard:0.1,shatter:0.0,disperse:0.7},
  {n:'STEP 06',title:'注入生命',desc:'骨骼与动作注入，形态开始呼吸、流动——从静态资产变成「活物」。',tool:'⚡ 自动绑定 + 动作',time:'约 1 分钟',
   color:[0.61,0.42,1.0],noise:3.2,disp:0.5,glow:2.4,particle:1.0,shard:0.0,shatter:0.0,disperse:0.9},
  {n:'STEP 07',title:'融入世界',desc:'绽放成完整资产，融入游戏世界，被光照与场景环绕——它，诞生了。',tool:'◈ 引擎直出',time:'一键入库',
   color:[1.0,0.85,0.45],noise:0.8,disp:0.22,glow:2.8,particle:0.9,shard:0.0,shatter:0.0,disperse:1.0},
];
const N=STAGES.length;

/* 构建叙事文字层 + 圆点 */
const stagesWrap=document.getElementById('stages');
stagesWrap.innerHTML=STAGES.map((s,i)=>{
  if(i===0){
    return `<section class="stage s0" data-i="0"><div class="stage-card">
      <div class="step-n">PROMPT INPUT</div>
      <div class="typed"><span id="typed"></span><span class="cursor">▍</span></div>
    </div></section>`;
  }
  return `<section class="stage s${i}" data-i="${i}"><div class="stage-card">
    <div class="step-n">${s.n}</div><h2>${s.title}</h2><p>${s.desc}</p>
    <span class="tool">${s.tool}</span><div class="time">${s.time}</div>
  </div></section>`;
}).join('');

const dots=document.getElementById('dots');
dots.innerHTML=STAGES.map((s,i)=>`<div class="d" data-i="${i}" title="${s.title}"></div>`).join('');
const dotEls=[...dots.children];

/* ====================================================================
   Three.js + Shader 抽象核心物体
==================================================================== */
let renderer,scene,camera,composer,bloomPass,clock;
let core,coreMat,particles,particleMat,envTex;
const canvas=document.getElementById('scene3d');

// —— 顶点着色器：噪声置换 + 晶体棱角化 + 碎片爆开 + 鼠标交互扰动 ——
const VERT=`
uniform float uTime; uniform float uNoise; uniform float uDisp;
uniform float uShard;   // 0=平滑球, 1=晶体切面
uniform float uShatter; // 0=完整, 1=碎片爆开
uniform vec3  uMouse;   // 鼠标在世界空间的方向(单位向量)
uniform float uMouseForce; // 鼠标扰动强度
varying vec3 vNormal; varying vec3 vViewPos; varying float vDisp; varying vec3 vWorldN;
// classic simplex noise (Ashima)
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+1.0*C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
void main(){
  vNormal=normalize(normalMatrix*normal);
  vWorldN=normalize(normal);
  // 噪声置换（流动）
  float n=snoise(normal*uNoise + uTime*0.25);
  // 晶体棱角化：将噪声量化成阶梯，产生切面感
  float crystal=floor(n*4.0)/4.0;
  float disp=mix(n,crystal,uShard)*uDisp;
  vDisp=n;
  vec3 pos=position+normal*disp;
  // 碎片爆开：沿法线向外炸开 + 扭转
  pos+=normal*uShatter*(0.6+0.8*abs(n));
  // 鼠标交互：朝向鼠标方向的表面凸起(吸附)
  float md=max(dot(normalize(normal),normalize(uMouse)),0.0);
  pos+=normal*pow(md,3.0)*uMouseForce;
  // 自转扭转
  float tw=uShatter*1.2;
  float c=cos(pos.y*tw), s=sin(pos.y*tw);
  pos.xz=mat2(c,-s,s,c)*pos.xz;
  vec4 mv=modelViewMatrix*vec4(pos,1.0);
  vViewPos=-mv.xyz;
  gl_Position=projectionMatrix*mv;
}`;

// —— 片元着色器：Fresnel + 彩虹色散 + 玻璃透亮 + 环境反射 ——
const FRAG=`
uniform vec3 uColor; uniform vec3 uColorB; uniform float uGlow; uniform float uTime; uniform float uDisperse;
uniform samplerCube uEnv; uniform float uReflect;
varying vec3 vNormal; varying vec3 vViewPos; varying float vDisp; varying vec3 vWorldN;
void main(){
  vec3 N=normalize(vNormal); vec3 V=normalize(vViewPos);
  float ndv=max(dot(N,V),0.0);
  float fres=pow(1.0-ndv,2.5);
  // 彩虹色散：按 Fresnel 给 RGB 不同强度，模拟玻璃边缘色散
  float d=uDisperse;
  vec3 disp=vec3(
    pow(1.0-ndv,2.5-d*1.2),
    pow(1.0-ndv,2.5),
    pow(1.0-ndv,2.5+d*1.2)
  );
  vec3 base=mix(uColor,uColorB,0.5+0.5*vDisp);
  // 环境反射：反射向量采样 cubemap，制造金属高光流动
  vec3 R=reflect(-V,N);
  vec3 envCol=textureCube(uEnv,R).rgb;
  vec3 col=base*(0.4+0.5*vDisp) + disp*uGlow*mix(uColor,vec3(1.0),0.5);
  col=mix(col,col+envCol*1.4,uReflect*(0.4+0.6*fres)); // 边缘反射更强
  // 玻璃透亮内反光
  col+=fres*0.7;
  col+=disp*0.5*d;   // 色散叠加彩边
  gl_FragColor=vec4(col,1.0);
}`;

function makeEnv(){
  // 程序化生成 cubemap 环境贴图：深色基调 + 几处彩色光斑，供金属反射
  const faces=[];
  const palette=[
    ['#2a1f4d','#e8b04b'],  // px
    ['#102a3a','#39e7d6'],  // nx
    ['#1a1830','#9b6bff'],  // py
    ['#0a0a14','#e3543b'],  // ny
    ['#241a30','#ffd98a'],  // pz
    ['#101822','#39e7d6'],  // nz
  ];
  for(let f=0;f<6;f++){
    const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,128,128);
    g.addColorStop(0,palette[f][0]);g.addColorStop(1,'#05050a');
    x.fillStyle=g;x.fillRect(0,0,128,128);
    // 一个发光光斑
    const rg=x.createRadialGradient(40+f*12,50,4,40+f*12,50,70);
    rg.addColorStop(0,palette[f][1]);rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg;x.fillRect(0,0,128,128);
    faces.push(c);
  }
  const tex=new THREE.CubeTexture(faces);
  tex.needsUpdate=true;
  return tex;
}

function buildCore(){
  const geo=new THREE.IcosahedronGeometry(2.0,64); // 高细分以支持平滑置换
  coreMat=new THREE.ShaderMaterial({
    vertexShader:VERT,fragmentShader:FRAG,
    uniforms:{
      uTime:{value:0},uNoise:{value:1.4},uDisp:{value:0.5},uGlow:{value:1.3},
      uShard:{value:0.0},uShatter:{value:0.0},uDisperse:{value:0.0},
      uEnv:{value:envTex},uReflect:{value:0.5},
      uMouse:{value:new THREE.Vector3(0,0,1)},uMouseForce:{value:0.0},
      uColor:{value:new THREE.Color(0.91,0.69,0.29)},
      uColorB:{value:new THREE.Color(0.22,0.9,0.84)},
    }
  });
  core=new THREE.Mesh(geo,coreMat);
  scene.add(core);

  // 内核光晕（一个小自发光球，给 Bloom 提供光源感）
  const halo=new THREE.Mesh(new THREE.SphereGeometry(1.2,32,32),
    new THREE.MeshBasicMaterial({color:0xffd98a,transparent:true,opacity:.25}));
  core.add(halo);
}

function buildParticles(){
  const COUNT=2600;
  const pos=new Float32Array(COUNT*3);
  const rnd=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    // 球壳分布
    const r=3.0+Math.random()*5.0;
    const th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2]=r*Math.cos(ph);
    rnd[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRnd',new THREE.BufferAttribute(rnd,1));
  particleMat=new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uSpread:{value:0.4},uColor:{value:new THREE.Color(0.91,0.69,0.29)}},
    vertexShader:`
      uniform float uTime; uniform float uSpread; attribute float aRnd;
      varying float vA;
      void main(){
        vec3 p=position;
        float t=uTime*0.3+aRnd*6.28;
        // 随 spread 在"聚拢(贴近核心)"与"散开"之间漂浮
        float s=mix(0.45,1.25,uSpread);
        p*=s;
        p.x+=sin(t)*0.3; p.y+=cos(t*1.3)*0.3; p.z+=sin(t*0.7)*0.3;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=(2.2+aRnd*2.5)*(300.0/-mv.z);
        gl_Position=projectionMatrix*mv;
        vA=0.4+0.6*aRnd;
      }`,
    fragmentShader:`
      uniform vec3 uColor; varying float vA;
      void main(){
        float d=distance(gl_PointCoord,vec2(0.5));
        if(d>0.5) discard;
        float a=smoothstep(0.5,0.0,d)*vA;
        gl_FragColor=vec4(uColor*1.4,a);
      }`
  });
  particles=new THREE.Points(g,particleMat);
  scene.add(particles);
}

function initThree(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x05050a,0.045);
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
  camera.position.set(0,0,8);

  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.setClearColor(0x05050a,1);

  envTex=makeEnv();
  buildCore();
  buildParticles();

  // 后期：Bloom 辉光
  composer=new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene,camera));
  bloomPass=new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.75,0.6,0.25);
  composer.addPass(bloomPass);

  clock=new THREE.Clock();
  S.intro=1;          // 电影化开场：从碎片汇聚成形
  resize();
  animate();
}

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  if(composer)composer.setSize(w,h);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

/* 鼠标视差 */
const mouse={x:0,y:0,tx:0,ty:0};
addEventListener('mousemove',e=>{mouse.tx=(e.clientX/innerWidth-0.5);mouse.ty=(e.clientY/innerHeight-0.5);});

/* 状态由滚动驱动 */
const S={color:new THREE.Color(0.91,0.69,0.29),colorB:new THREE.Color(0.22,0.9,0.84),
         noise:1.4,disp:0.5,glow:1.3,particle:0.3,rotSpeed:0.12,scale:1,
         shard:0,shatter:0,disperse:0.3,intro:0};

function animate(){
  requestAnimationFrame(animate);
  try{
  const t=clock.getElapsedTime();
  // 平滑鼠标
  mouse.x+=(mouse.tx-mouse.x)*0.05; mouse.y+=(mouse.ty-mouse.y)*0.05;

  // 电影化开场：intro 从 1→0，核心由"碎片汇聚"成形
  S.intro+=(0-S.intro)*0.012;

  if(core){
    coreMat.uniforms.uTime.value=t;
    const u=coreMat.uniforms;
    u.uNoise.value+=(S.noise-u.uNoise.value)*0.06;
    u.uDisp.value +=(S.disp -u.uDisp.value )*0.06;
    u.uGlow.value +=(S.glow -u.uGlow.value )*0.06;
    u.uShard.value+=(S.shard-u.uShard.value)*0.05;
    // 开场时叠加额外 shatter（汇聚动画）
    const targetShatter=Math.max(S.shatter,S.intro*1.6);
    u.uShatter.value+=(targetShatter-u.uShatter.value)*0.05;
    u.uDisperse.value+=(S.disperse-u.uDisperse.value)*0.05;
    u.uColor.value.lerp(S.color,0.06);
    u.uColorB.value.lerp(S.colorB,0.06);
    // 鼠标方向(相机空间近似)：用鼠标偏移驱动表面凸起
    u.uMouse.value.set(mouse.x*2.0,-mouse.y*2.0,1.0).normalize();
    const wantForce=(Math.abs(mouse.tx)+Math.abs(mouse.ty)>0.001)?0.35:0.0;
    u.uMouseForce.value+=(wantForce-u.uMouseForce.value)*0.06;
    core.rotation.y+=0.0025+S.rotSpeed*0.004;
    core.rotation.x=mouse.y*0.4;
    const sc=core.scale.x+(S.scale-core.scale.x)*0.06;
    core.scale.setScalar(sc);
  }
  if(particles){
    particleMat.uniforms.uTime.value=t;
    const pu=particleMat.uniforms;
    // 开场粒子从远处(spread 大)汇聚到当前阶段值
    const targetSpread=S.particle+S.intro*2.2;
    pu.uSpread.value+=(targetSpread-pu.uSpread.value)*0.05;
    pu.uColor.value.lerp(S.color,0.05);
    particles.rotation.y-=0.0006;
  }
  if(bloomPass){bloomPass.strength+=(( S.glow*0.42 )-bloomPass.strength)*0.05;}

  // 相机视差
  camera.position.x+=(mouse.x*1.2-camera.position.x)*0.04;
  camera.position.y+=(-mouse.y*0.8-camera.position.y)*0.04;
  camera.lookAt(0,0,0);

  composer.render();
  }catch(err){
    if(!window.__animErr){window.__animErr=1;console.error('[墨灵] 渲染循环错误：',err);
      const lo=document.getElementById('loading');
      if(lo){lo.classList.remove('hide');lo.innerHTML='<div style="color:#8e879c;text-align:center;line-height:1.8;padding:0 8vw">3D 渲染出错（已捕获）<br><span style="color:#e8b04b;font-size:12px">'+(err&&err.message||err)+'</span></div>';}
    }
  }
}

/* ====================================================================
   GSAP ScrollTrigger + Lenis
==================================================================== */
function setStage(i){
  const s=STAGES[i];
  S.color.setRGB(s.color[0],s.color[1],s.color[2]);
  // colorB 取下一阶段色，制造渐变流动
  const nx=STAGES[Math.min(N-1,i+1)].color;
  S.colorB.setRGB(nx[0],nx[1],nx[2]);
  S.noise=s.noise; S.disp=s.disp; S.glow=s.glow; S.particle=s.particle;
  S.shard=s.shard; S.shatter=s.shatter; S.disperse=s.disperse;
  S.rotSpeed=(i===3)?1.0:0.12;            // 多面审视阶段转快
  S.scale=(i===N-1)?1.15:(i===0?1.05:1.0);
  dotEls.forEach((d,k)=>d.classList.toggle('active',k===i));
}

function initScroll(){
  gsap.registerPlugin(ScrollTrigger);

  // Lenis 平滑滚动
  let lenis=null;
  const LenisCtor=window.Lenis||(window.lenis&&window.lenis.default)||(typeof Lenis!=='undefined'?Lenis:null);
  if(LenisCtor){try{
    lenis=new LenisCtor({duration:1.2,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t)),smoothWheel:true});
    lenis.on('scroll',()=>ScrollTrigger.update());
    gsap.ticker.add(t=>lenis.raf(t*1000)); gsap.ticker.lagSmoothing(0);
  }catch(e){console.warn('Lenis 回退',e);lenis=null;}}

  const progressBar=document.getElementById('progress');

  // 每个 .stage 一屏，进入时切换 3D 状态 + 文字浮现
  const stageEls=[...document.querySelectorAll('.stage')];
  stageEls.forEach((el,i)=>{
    ScrollTrigger.create({
      trigger:el,start:'top 60%',end:'bottom 40%',
      onEnter:()=>setStage(i),
      onEnterBack:()=>setStage(i),
    });
    // 文字逐项浮现
    const items=el.querySelectorAll('.stage-card>*');
    gsap.fromTo(items,{y:40,autoAlpha:0},{
      y:0,autoAlpha:1,duration:.9,stagger:.12,ease:'power3.out',
      scrollTrigger:{trigger:el,start:'top 65%'}
    });
  });

  // 全局进度条
  ScrollTrigger.create({
    trigger:document.body,start:'top top',end:'bottom bottom',
    onUpdate:self=>{progressBar.style.width=(self.progress*100)+'%';}
  });

  // 圆点点击跳转
  dots.addEventListener('click',e=>{
    const d=e.target.closest('.d');if(!d)return;
    const i=+d.dataset.i;
    const target=stageEls[i];
    if(lenis)lenis.scrollTo(target,{offset:-innerHeight*0.2,duration:1.2});
    else target.scrollIntoView({behavior:'smooth'});
  });

  // Hero / Final 入场
  gsap.from('.hero h1',{y:50,autoAlpha:0,duration:1.1,delay:.2});
  gsap.from('.hero p',{y:30,autoAlpha:0,duration:1,delay:.5});
  gsap.from('.hero .badge',{y:20,autoAlpha:0,duration:.8});
  gsap.from('.final h2',{y:50,autoAlpha:0,duration:1,scrollTrigger:{trigger:'.final',start:'top 70%'}});
  gsap.from('.final p',{y:40,autoAlpha:0,duration:1,delay:.15,scrollTrigger:{trigger:'.final',start:'top 70%'}});
  gsap.from('.final .row',{y:40,autoAlpha:0,duration:1,delay:.3,scrollTrigger:{trigger:'.final',start:'top 70%'}});

  setStage(0);
}

/* 打字机 */
function initTyping(){
  const el=document.getElementById('typed');if(!el)return;
  const full='“一位身披霜羽、手持长剑的东方女武者”';
  let i=0,dir=1;
  setInterval(()=>{i+=dir;if(i>=full.length){dir=-1;i=full.length;}if(i<=6){dir=1;i=6;}el.textContent=full.slice(0,i);},95);
}

/* ====================================================================
   启动（等待依赖就绪）
==================================================================== */
addEventListener('load',()=>{
  const lo=document.getElementById('loading');
  const hide=()=>lo.classList.add('hide');
  function ready(){return typeof THREE!=='undefined'&&typeof gsap!=='undefined'&&typeof ScrollTrigger!=='undefined'&&THREE.EffectComposer&&THREE.UnrealBloomPass;}
  function boot(){try{initThree();initScroll();initTyping();setTimeout(hide,300);}
    catch(err){console.error('[墨灵]',err);lo.innerHTML='<div style="color:var(--ink-dim);text-align:center;line-height:1.8">初始化失败，请刷新<br><span style="color:var(--gold);font-size:12px">'+(err&&err.message||'')+'</span></div>';setTimeout(hide,2000);}}
  let w=0;const tm=setInterval(()=>{
    if(ready()){clearInterval(tm);boot();return;}
    w+=120;if(w>=6000){clearInterval(tm);
      const miss=[];if(typeof THREE==='undefined')miss.push('Three.js');if(typeof gsap==='undefined')miss.push('GSAP');if(typeof ScrollTrigger==='undefined')miss.push('ScrollTrigger');if(typeof THREE!=='undefined'&&!THREE.EffectComposer)miss.push('后期模块');
      const f=(window.__cdnFail&&window.__cdnFail.length)?(' / 报错:'+window.__cdnFail.join('、')):'';
      lo.innerHTML='<div style="color:var(--ink-dim);text-align:center;line-height:1.9">以下库未加载：<br><span style="color:var(--gold);font-size:13px">'+(miss.join('、')||'未知')+f+'</span></div>';
      setTimeout(hide,2500);
    }
  },120);
});
</script>
